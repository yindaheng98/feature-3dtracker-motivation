# Docker is used here only for permission control around host bind mounts.
# Runtime dependencies are expected to come from the mounted host environment.
services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    network_mode: host
    working_dir: ${PWD:?PWD is required}
    user: "${SUDO_UID:-${UID:-UID is required}}:${SUDO_GID:-${GID:-GID is required}}"
    environment:
      HOME: /home/${SUDO_USER:-${USER:-USER is required}}
      CODEX_HOME: ${PWD:?PWD is required}/.codex
      CLAUDE_CONFIG_DIR: ${PWD:?PWD is required}/.claude
      GIT_AUTHOR_NAME: codex
      GIT_AUTHOR_EMAIL: noreply@openai.com
      GIT_COMMITTER_NAME: codex
      GIT_COMMITTER_EMAIL: noreply@openai.com
    volumes:
      - type: bind
        source: /etc/passwd
        target: /etc/passwd
        read_only: true
      - type: bind
        source: /etc/group
        target: /etc/group
        read_only: true
      - type: bind
        source: /home/${SUDO_USER:-${USER:-USER is required}}
        target: /home/${SUDO_USER:-${USER:-USER is required}}
        read_only: true
      - type: bind
        source: .
        target: ${PWD:?PWD is required}
        read_only: true
      - type: bind
        source: ./.codex
        target: ${PWD:?PWD is required}/.codex
      - type: bind
        source: ./.claude
        target: ${PWD:?PWD is required}/.claude
      - type: bind
        source: ./.venv
        target: ${PWD:?PWD is required}/.venv
      - type: bind
        source: ./.git/modules/codebase
        target: ${PWD:?PWD is required}/.git/modules/codebase
      - type: bind
        source: ./workspace
        target: ${PWD:?PWD is required}/workspace
      - type: volume
        source: codebase-data-overlay
        target: ${PWD:?PWD is required}/workspace/codebase/data
      - type: volume
        source: codebase-output-overlay
        target: ${PWD:?PWD is required}/workspace/codebase/output
      - type: bind
        source: ./skills
        target: ${PWD:?PWD is required}/skills
    entrypoint:
      - /bin/bash
      - -lc
      - |
        ln -sfn "${PWD:?PWD is required}/workspace" /tmp/workspace
        if [ -s "/home/${SUDO_USER:-${USER:-USER is required}}/.nvm/nvm.sh" ]; then
          source "/home/${SUDO_USER:-${USER:-USER is required}}/.nvm/nvm.sh"
        fi
        source "${PWD:?PWD is required}/.venv/bin/activate"
        exec "$@"
      - --
    command: npm run codex -- -a never -s danger-full-access
    # command: [ "bash", "runs/develop.sh" ]

volumes:
  codebase-data-overlay:
    driver: local
    driver_opts:
      type: overlay
      device: overlay
      # Overlayfs requires workdir to live on the same filesystem as upperdir.
      o: lowerdir=/mnt/minorissd4tb/TrackerSplat/data,upperdir=/mnt/minorissd4tb/Pensieve-CAGS-Harness/workspace/codebase/data,workdir=/mnt/minorissd4tb/Pensieve-CAGS-Harness/.overlay-work/data
  codebase-output-overlay:
    driver: local
    driver_opts:
      type: overlay
      device: overlay
      # Overlayfs requires workdir to live on the same filesystem as upperdir.
      o: lowerdir=/mnt/minorissd4tb/TrackerSplat/output,upperdir=/mnt/minorissd4tb/Pensieve-CAGS-Harness/workspace/codebase/output,workdir=/mnt/minorissd4tb/Pensieve-CAGS-Harness/.overlay-work/output